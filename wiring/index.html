<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moto Zero · Wiring Lab</title>
  <meta name="description" content="The Module 3 wiring plates made live: trace the main harness and work the starting, charging and ignition circuits, with faults to diagnose.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css?v=20261101b">
  <style>.mz-wiring { display: block; width: 100%; min-height: 1200px; border: 0; background: transparent; }</style>
</head>
<body>
<div class="ute-page">
  <header class="ute-top">
    <a class="ute-brand" href="../" aria-label="Moto Zero home"><img class="ute-brand-mark" src="../assets/brand-mark.svg" alt=""><span class="ute-brand-word">moto zero</span><span class="ute-brand-sub">Transitions Lab</span></a>
    <nav data-mz-nav></nav>
  </header>
  <iframe class="mz-wiring" id="mz-wiring" title="Moto Zero Wiring Lab" src="../assets/interactive/wiring/wiring.html"></iframe>
  <footer data-mz-footer></footer>
</div>
<script>
(function () {
  var f = document.getElementById('mz-wiring');
  var tab = (location.hash || '').slice(1);
  if (tab) f.src = '../assets/interactive/wiring/wiring.html#' + tab;
  function fit() { try { f.style.height = Math.ceil(f.contentDocument.documentElement.scrollHeight) + 'px'; } catch (e) {} }
  f.addEventListener('load', function () {
    fit();
    try { new ResizeObserver(fit).observe(f.contentDocument.documentElement); } catch (e) { setInterval(fit, 1000); }
    try { f.contentWindow.addEventListener('hashchange', function () { history.replaceState(null, '', '#' + f.contentWindow.location.hash.slice(1)); }); } catch (e) {}
  });
  window.addEventListener('hashchange', function () { try { f.contentWindow.location.hash = location.hash; } catch (e) {} });
})();
</script>
<script type="module" src="../assets/site.js"></script>
</body>
</html>
