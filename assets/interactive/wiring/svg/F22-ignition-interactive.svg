<text class="m" x="1112" y="164" text-anchor="end">−</text>
<text class="m" x="1178" y="164">+</text>
<text x="1386" y="88">HT lead</text>
<text x="1084" y="336">Ignition coil</text>
<text class="s" x="1084" y="360">The ECU earths the coil primary for</text>
<text class="s" x="1084" y="379">the dwell time; when the IGBT opens</text>
<text class="s" x="1084" y="398">the collapsing field induces 20–40 kV</text>
<text class="s" x="1084" y="417">in the secondary and the plug fires.</text>
