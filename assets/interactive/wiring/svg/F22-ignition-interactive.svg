<text class="s" x="24" y="472">C charges to roughly 150–300 V from the source coil through D; the pulser fires</text>
<text class="s" x="24" y="491">the SCR and C discharges into the coil primary. The engine stop switch kills the</text>
<text class="s" x="24" y="510">spark by shorting the source coil to earth.</text>

