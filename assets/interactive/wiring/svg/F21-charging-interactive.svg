<g class="hots"><circle class="hot" data-k="rotor" cx="330" cy="400" r="180"/><circle class="hot" data-k="stator" cx="330" cy="400" r="150"/><rect class="hot" data-k="leads" x="368" y="384" width="204" height="32" rx="6"/><rect class="hot" data-k="regrec" x="604" y="146" width="640" height="506" rx="6"/><rect class="hot" data-k="bridge" x="772" y="266" width="272" height="50" rx="6"/><rect class="hot" data-k="bridge" x="782" y="526" width="36" height="38" rx="6"/><rect class="hot" data-k="bridge" x="892" y="526" width="36" height="38" rx="6"/><rect class="hot" data-k="bridge" x="1002" y="526" width="36" height="38" rx="6"/><rect class="hot" data-k="scr" x="828" y="526" width="36" height="38" rx="6"/><rect class="hot" data-k="scr" x="938" y="526" width="36" height="38" rx="6"/><rect class="hot" data-k="scr" x="1048" y="526" width="36" height="38" rx="6"/><rect class="hot" data-k="sense" x="1100" y="334" width="102" height="112" rx="6"/><rect class="hot" data-k="fuse" x="1294" y="232" width="66" height="36" rx="6"/><rect class="hot" data-k="battery" x="1348" y="460" width="210" height="174" rx="6"/><rect class="hot" data-k="ignsw" data-sw="ignsw" x="1432" y="220" width="66" height="40" rx="6"/><rect class="hot" data-k="loads" x="1562" y="312" width="56" height="56" rx="6"/></g>
