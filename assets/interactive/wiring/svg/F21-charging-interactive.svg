<path class="w seg" data-seg="load2" d="M1494,250 H1590 V318"/>
<circle class="p" id="lamp" cx="1590" cy="340" r="22"/>
<path class="w" d="M1574.4,324.4 L1605.6,355.6 M1605.6,324.4 L1574.4,355.6"/>
<path class="w seg" data-seg="load3" d="M1590,362 V446"/>
<use xlink:href="#f21-j" x="1590" y="446"/>
<text x="1466" y="208" text-anchor="middle">Ignition switch</text>
<text x="1560" y="345" text-anchor="end">Loads</text>
